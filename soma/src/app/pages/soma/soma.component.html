<nav class="navbar navbar-default">
  <div class="conteiner-fluid">
    <a class="navbar-brand" href="#">
      Projeto Soma
    </a>
  </div>
</nav>
<div class="container">
  <div class="col-md-12">
    <form>
      <div class="form-group row">
        <label for="numero1" class="col-md-2 col-form-label">
          Número 1:
        </label>
        <div class="col-md-4">
          <input type="text" id="numero1" class="form-control" placeholder="Número 1" #numero1>
          <small class="form-text text-muted">
            Digite o primeiro número.
          </small>
        </div>
      </div>
      <div class="form-group row">
        <label for="numero1" class="col-md-2 col-form-label">
          Número 2:
        </label>
        <div class="col-md-4">
          <input type="text" id="numero2" class="form-control" placeholder="Número 2" #numero2>
          <small class="form-text text-muted">
            Digite o segundo número.
          </small>
        </div>
      </div>
      <div class="row col-md-2 offset-md-3">
        <button type="button" class="btn btn-primary" (click)="somarBotao(numero1.value, numero2.value)">
          Somar
        </button>
      </div>
      <div class="form-group row">
        <label for="resultado" class="col-md-2 col-form-label">Resultado:</label>
        <div class="col-md-4">
          <input type="text" id="resultado" class="form-control" placeholder="Resultado" [value]="resultado" readonly>
        </div>
      </div>
    </form>
  </div>
</div>
